<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" class="cd-hero" role="img" aria-labelledby="cdP-title"><title id="cdP-title">The District at Golden Hour: steam layer (portrait)</title><style>.cd-hero .cloud{animation:cdh-drift 46s ease-in-out infinite alternate}
.cd-hero .cloud:nth-child(2n){animation-duration:58s;animation-direction:alternate-reverse}
.cd-hero .cloud:nth-child(3n){animation-duration:39s}
.cd-hero .flag{transform-box:fill-box;transform-origin:50% 0;animation:cdh-flutter 2.6s ease-in-out infinite}
.cd-hero .flag:nth-child(2n){animation-duration:3.1s;animation-delay:-1.1s}
.cd-hero .flag:nth-child(3n){animation-duration:2.2s;animation-delay:-.5s}
.cd-hero .lantern{transform-box:fill-box;transform-origin:50% 0;animation:cdh-sway 4.6s ease-in-out infinite}
.cd-hero .lantern:nth-of-type(2n){animation-duration:5.4s;animation-delay:-1.8s}
.cd-hero .steam{transform-box:fill-box;transform-origin:50% 100%;animation:cdh-rise 3.8s ease-out infinite}
.cd-hero .sun-rays{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-spin 140s linear infinite}
.cd-hero .sun-glow{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-pulse 7s ease-in-out infinite}
@keyframes cdh-drift{from{transform:translateX(-34px)}to{transform:translateX(46px)}}
@keyframes cdh-flutter{0%,100%{transform:rotate(-6deg) skewX(4deg)}50%{transform:rotate(6deg) skewX(-4deg)}}
@keyframes cdh-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes cdh-rise{0%{transform:translateY(16px) scale(.8);opacity:0}22%{opacity:.95}100%{transform:translateY(-54px) scale(1.18);opacity:0}}
@keyframes cdh-spin{to{transform:rotate(360deg)}}
@keyframes cdh-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.72}}
.cd-hero.is-paused *,.cd-hero .is-paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.cd-hero *{animation:none!important}}</style><defs><linearGradient id="cdP-sky" x1="0" y1="0" x2="0" y2="1200" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#EE4F98"/><stop offset=".3" stop-color="#FF7A52"/><stop offset=".52" stop-color="#FFA23E"/><stop offset=".72" stop-color="#FFC857"/><stop offset="1" stop-color="#FFE4A6"/></linearGradient><radialGradient id="cdP-glow" cx=".5" cy=".82" r=".85"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".45" stop-color="#FFE38E"/><stop offset="1" stop-color="#FFB000"/></radialGradient><radialGradient id="cdP-halo"><stop offset="0" stop-color="#FFE7A0" stop-opacity=".7"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></radialGradient></defs><g id="steam" stroke="#1D1147" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round"><g class="steam" opacity="0.9" style="animation-delay:0s"><path d="M559 876.6C544 855 574 844.2 559 826.2S550 811.8 562.7 804.6" fill="none" stroke-width="15.6"/><path d="M559 876.6C544 855 574 844.2 559 826.2S550 811.8 562.7 804.6" fill="none" stroke="#FFFDF5" stroke-width="8.3"/></g><g class="steam" opacity="0.9" style="animation-delay:-1.7s"><path d="M579 876.6C564 855 594 844.2 579 826.2S570 811.8 582.7 804.6" fill="none" stroke-width="15.6"/><path d="M579 876.6C564 855 594 844.2 579 826.2S570 811.8 582.7 804.6" fill="none" stroke="#FFFDF5" stroke-width="8.3"/></g><g class="steam" opacity="0.9" style="animation-delay:-1.1s"><path d="M634.8 895.8C619.8 874.2 649.8 863.4 634.8 845.4S625.8 831 638.6 823.8" fill="none" stroke-width="15.6"/><path d="M634.8 895.8C619.8 874.2 649.8 863.4 634.8 845.4S625.8 831 638.6 823.8" fill="none" stroke="#FFFDF5" stroke-width="8.3"/></g><g class="steam" opacity="0.9" style="animation-delay:-2.8s"><path d="M654.8 895.8C639.8 874.2 669.8 863.4 654.8 845.4S645.8 831 658.6 823.8" fill="none" stroke-width="15.6"/><path d="M654.8 895.8C639.8 874.2 669.8 863.4 654.8 845.4S645.8 831 658.6 823.8" fill="none" stroke="#FFFDF5" stroke-width="8.3"/></g><g class="steam" opacity="0.9" style="animation-delay:-2.2s"><path d="M591.6 887.2C576.6 865.6 606.6 854.8 591.6 836.8S582.6 822.4 595.4 815.2" fill="none" stroke-width="15.6"/><path d="M591.6 887.2C576.6 865.6 606.6 854.8 591.6 836.8S582.6 822.4 595.4 815.2" fill="none" stroke="#FFFDF5" stroke-width="8.3"/></g><g class="steam" opacity="0.9" style="animation-delay:-3.9s"><path d="M611.6 887.2C596.6 865.6 626.6 854.8 611.6 836.8S602.6 822.4 615.4 815.2" fill="none" stroke-width="15.6"/><path d="M611.6 887.2C596.6 865.6 626.6 854.8 611.6 836.8S602.6 822.4 615.4 815.2" fill="none" stroke="#FFFDF5" stroke-width="8.3"/></g><g class="steam" opacity="0.9" style="animation-delay:-0.6s;animation-duration:4.4s"><path d="M556.2 468.2C539.2 444.2 573.2 432.2 556.2 412.2S546 396.2 560.4 388.2" fill="none" stroke-width="16.7"/><path d="M556.2 468.2C539.2 444.2 573.2 432.2 556.2 412.2S546 396.2 560.4 388.2" fill="none" stroke="#FFFDF5" stroke-width="9.4"/></g><g class="steam" opacity="0.9" style="animation-delay:-2.4s;animation-duration:4.4s"><path d="M571 463.6C556 442.6 586 432.1 571 414.6S562 400.6 574.8 393.6" fill="none" stroke-width="15.6"/><path d="M571 463.6C556 442.6 586 432.1 571 414.6S562 400.6 574.8 393.6" fill="none" stroke="#FFFDF5" stroke-width="8.3"/></g></g></svg>