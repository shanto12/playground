<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" class="cd-hero" role="img" aria-labelledby="cdP-title"><title id="cdP-title">The District at Golden Hour: far-buildings layer (portrait)</title><style>.cd-hero .cloud{animation:cdh-drift 46s ease-in-out infinite alternate}
.cd-hero .cloud:nth-child(2n){animation-duration:58s;animation-direction:alternate-reverse}
.cd-hero .cloud:nth-child(3n){animation-duration:39s}
.cd-hero .flag{transform-box:fill-box;transform-origin:50% 0;animation:cdh-flutter 2.6s ease-in-out infinite}
.cd-hero .flag:nth-child(2n){animation-duration:3.1s;animation-delay:-1.1s}
.cd-hero .flag:nth-child(3n){animation-duration:2.2s;animation-delay:-.5s}
.cd-hero .lantern{transform-box:fill-box;transform-origin:50% 0;animation:cdh-sway 4.6s ease-in-out infinite}
.cd-hero .lantern:nth-of-type(2n){animation-duration:5.4s;animation-delay:-1.8s}
.cd-hero .steam{transform-box:fill-box;transform-origin:50% 100%;animation:cdh-rise 3.8s ease-out infinite}
.cd-hero .sun-rays{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-spin 140s linear infinite}
.cd-hero .sun-glow{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-pulse 7s ease-in-out infinite}
@keyframes cdh-drift{from{transform:translateX(-34px)}to{transform:translateX(46px)}}
@keyframes cdh-flutter{0%,100%{transform:rotate(-6deg) skewX(4deg)}50%{transform:rotate(6deg) skewX(-4deg)}}
@keyframes cdh-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes cdh-rise{0%{transform:translateY(16px) scale(.8);opacity:0}22%{opacity:.95}100%{transform:translateY(-54px) scale(1.18);opacity:0}}
@keyframes cdh-spin{to{transform:rotate(360deg)}}
@keyframes cdh-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.72}}
.cd-hero.is-paused *,.cd-hero .is-paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.cd-hero *{animation:none!important}}</style><defs><linearGradient id="cdP-sky" x1="0" y1="0" x2="0" y2="1200" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#EE4F98"/><stop offset=".3" stop-color="#FF7A52"/><stop offset=".52" stop-color="#FFA23E"/><stop offset=".72" stop-color="#FFC857"/><stop offset="1" stop-color="#FFE4A6"/></linearGradient><radialGradient id="cdP-glow" cx=".5" cy=".82" r=".85"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".45" stop-color="#FFE38E"/><stop offset="1" stop-color="#FFB000"/></radialGradient><pattern id="cdP-violetL" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.4" fill="#6A55C9"/><circle cx="19" cy="19" r="2.4" fill="#6A55C9"/></pattern><pattern id="cdP-raniL" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.4" fill="#FF8CC0"/><circle cx="19" cy="19" r="2.4" fill="#FF8CC0"/></pattern><pattern id="cdP-cilL" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.4" fill="#86CF6E"/><circle cx="19" cy="19" r="2.4" fill="#86CF6E"/></pattern><pattern id="cdP-dado" width="30" height="36" x="-195" y="-38" patternUnits="userSpaceOnUse"><g fill="#FFF4DC"><circle cx="15" cy="12" r="4"/><circle cx="15" cy="24" r="4"/><circle cx="9" cy="18" r="4"/><circle cx="21" cy="18" r="4"/></g><circle cx="15" cy="18" r="3" fill="#FFB000"/></pattern><radialGradient id="cdP-halo"><stop offset="0" stop-color="#FFE7A0" stop-opacity=".7"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></radialGradient></defs><g id="far-buildings" stroke="#1D1147" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round"><g stroke="none"><rect x="-30" y="405" width="65" height="599" fill="#F59A95"/><path d="M-30 405a8 8 0 0 1 15.9 0a8 8 0 0 1 15.9 0a8 8 0 0 1 15.9 0a8 8 0 0 1 15.9 0Z" fill="#F59A95"/><rect x="33.8" y="440" width="83" height="564" fill="#F59A95"/><rect x="58" y="414" width="26" height="26" fill="#F59A