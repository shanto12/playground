<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" class="cd-hero" role="img" aria-labelledby="cdP-title"><title id="cdP-title">The District at Golden Hour: sun layer (portrait)</title><style>.cd-hero .cloud{animation:cdh-drift 46s ease-in-out infinite alternate}
.cd-hero .cloud:nth-child(2n){animation-duration:58s;animation-direction:alternate-reverse}
.cd-hero .cloud:nth-child(3n){animation-duration:39s}
.cd-hero .flag{transform-box:fill-box;transform-origin:50% 0;animation:cdh-flutter 2.6s ease-in-out infinite}
.cd-hero .flag:nth-child(2n){animation-duration:3.1s;animation-delay:-1.1s}
.cd-hero .flag:nth-child(3n){animation-duration:2.2s;animation-delay:-.5s}
.cd-hero .lantern{transform-box:fill-box;transform-origin:50% 0;animation:cdh-sway 4.6s ease-in-out infinite}
.cd-hero .lantern:nth-of-type(2n){animation-duration:5.4s;animation-delay:-1.8s}
.cd-hero .steam{transform-box:fill-box;transform-origin:50% 100%;animation:cdh-rise 3.8s ease-out infinite}
.cd-hero .sun-rays{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-spin 140s linear infinite}
.cd-hero .sun-glow{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-pulse 7s ease-in-out infinite}
@keyframes cdh-drift{from{transform:translateX(-34px)}to{transform:translateX(46px)}}
@keyframes cdh-flutter{0%,100%{transform:rotate(-6deg) skewX(4deg)}50%{transform:rotate(6deg) skewX(-4deg)}}
@keyframes cdh-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes cdh-rise{0%{transform:translateY(16px) scale(.8);opacity:0}22%{opacity:.95}100%{transform:translateY(-54px) scale(1.18);opacity:0}}
@keyframes cdh-spin{to{transform:rotate(360deg)}}
@keyframes cdh-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.72}}
.cd-hero.is-paused *,.cd-hero .is-paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.cd-hero *{animation:none!important}}</style><defs><linearGradient id="cdP-sky" x1="0" y1="0" x2="0" y2="1200" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#EE4F98"/><stop offset=".3" stop-color="#FF7A52"/><stop offset=".52" stop-color="#FFA23E"/><stop offset=".72" stop-color="#FFC857"/><stop offset="1" stop-color="#FFE4A6"/></linearGradient><radialGradient id="cdP-glow" cx=".5" cy=".82" r=".85"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".45" stop-color="#FFE38E"/><stop offset="1" stop-color="#FFB000"/></radialGradient><radialGradient id="cdP-halo"><stop offset="0" stop-color="#FFE7A0" stop-opacity=".7"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></radialGradient></defs><g id="sun" stroke="#1D1147" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round"><g class="sun-glow" stroke="none"><circle cx="400" cy="500" r="490" fill="#FFF4DC" opacity="0.1"/><circle cx="400" cy="500" r="362.6" fill="#FFF4DC" opacity="0.1"/><circle cx="400" cy="500" r="266.6" fill="#FFF4DC" opacity="0.2"/></g><path d="M400 500L1898.1 425L1898.1 575ZM400 500L1538.7 768.8L1520.5 836.6ZM400 500L1734.9 1184.1L1659.9 1314ZM400 500L1251.8 1302.1L1202.1 1351.8ZM400 500L1214 1759.9L1084.1 1834.9ZM400 500L736.6 1620.5L668.8 1638.7ZM400 500L475 1998.1L325 1998.1ZM400 500L131.2 1638.7L63.4 1620.5ZM400 500L-284.1 1834.9L-414 1759.9ZM400 500L-402.1 1351.8L-451.8 1302.1ZM400 500L-859.9 1314L-934.9 1184.1ZM400 500L-720.5 836.6L-738.7 768.8ZM400 500L-1098.1 575L-1098.1 425ZM400 500L-738.7 231.2L-720.5 163.4ZM400 500L-934.9 -184.1L-859.9 -314ZM400 500L-451.8 -302.1L-402.1 -351.8ZM400 500L-414 -759.9L-284.1 -834.9ZM400 500L63.4 -620.5L131.2 -638.7ZM400 500L325 -998.1L475 -998.1ZM400 500L668.8 -638.7L736.6 -620.5ZM400 500L1084.1 -834.9L1214 -759.9ZM400 500L1202.1 -351.8L1251.8 -302.1ZM400 500L1659.9 -314L1734.9 -184.1ZM400 500L1520.5 163.4L1538.7 231.2Z" fill="#FFF4DC" class="sun-rays" stroke="none" opacity="0.2"/><circle cx="400" cy="500" r="196" fill="#FFD56E" stroke-width="5.1"/><circle cx="400" cy="500" r="160.7" fill="#FFE7A1" stroke="none"/><circle cx="341.2" cy="437.3" r="39.2" fill="#FFF4DC" stroke="none" opacity="0.8"/></g></svg>