<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" class="cd-hero" role="img" aria-labelledby="cdP-title"><title id="cdP-title">The District at Golden Hour: people layer (portrait)</title><style>.cd-hero .cloud{animation:cdh-drift 46s ease-in-out infinite alternate}
.cd-hero .cloud:nth-child(2n){animation-duration:58s;animation-direction:alternate-reverse}
.cd-hero .cloud:nth-child(3n){animation-duration:39s}
.cd-hero .flag{transform-box:fill-box;transform-origin:50% 0;animation:cdh-flutter 2.6s ease-in-out infinite}
.cd-hero .flag:nth-child(2n){animation-duration:3.1s;animation-delay:-1.1s}
.cd-hero .flag:nth-child(3n){animation-duration:2.2s;animation-delay:-.5s}
.cd-hero .lantern{transform-box:fill-box;transform-origin:50% 0;animation:cdh-sway 4.6s ease-in-out infinite}
.cd-hero .lantern:nth-of-type(2n){animation-duration:5.4s;animation-delay:-1.8s}
.cd-hero .steam{transform-box:fill-box;transform-origin:50% 100%;animation:cdh-rise 3.8s ease-out infinite}
.cd-hero .sun-rays{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-spin 140s linear infinite}
.cd-hero .sun-glow{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-pulse 7s ease-in-out infinite}
@keyframes cdh-drift{from{transform:translateX(-34px)}to{transform:translateX(46px)}}
@keyframes cdh-flutter{0%,100%{transform:rotate(-6deg) skewX(4deg)}50%{transform:rotate(6deg) skewX(-4deg)}}
@keyframes cdh-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes cdh-rise{0%{transform:translateY(16px) scale(.8);opacity:0}22%{opacity:.95}100%{transform:translateY(-54px) scale(1.18);opacity:0}}
@keyframes cdh-spin{to{transform:rotate(360deg)}}
@keyframes cdh-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.72}}
.cd-hero.is-paused *,.cd-hero .is-paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.cd-hero *{animation:none!important}}</style><defs><linearGradient id="cdP-sky" x1="0" y1="0" x2="0" y2="1200" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#EE4F98"/><stop offset=".3" stop-color="#FF7A52"/><stop offset=".52" stop-color="#FFA23E"/><stop offset=".72" stop-color="#FFC857"/><stop offset="1" stop-color="#FFE4A6"/></linearGradient><radialGradient id="cdP-glow" cx=".5" cy=".82" r=".85"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".45" stop-color="#FFE38E"/><stop offset="1" stop-color="#FFB000"/></radialGradient><radialGradient id="cdP-halo"><stop offset="0" stop-color="#FFE7A0" stop-opacity=".7"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></radialGradient></defs><g id="people" stroke="#1D1147" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round"><path d="M683.1 953L676.6 978.8L675 1001.4" fill="none" stroke-width="18.9"/><path d="M683.1 953L676.6 978.8L675 1001.4" fill="none" stroke="#86522F" stroke-width="9.7"/><path d="M683.1 953L679.9 965.9" fill="none" stroke-width="21.5"/><path d="M683.1 953L679.9 965.9" fill="none" stroke="#FFF4DC" stroke-width="12.3"/><circle cx="675" cy="1001.4" r="5.5" fill="#86522F" stroke-width="3.2"/><path d="M694.4 999.8L692 1069.2" fill="none" stroke-width="20.5"/><path d="M694.4 999.8L692 1069.2" fill="none" stroke="#2A2158" stroke-width="11.3"/><path d="M700.8 999.8L703.2 1069.2" fill="none" stroke-width="20.5"/><path d="M700.8 999.8L703.2 1069.2" fill="none" stroke="#2A2158" stroke-width="11.3"/><ellipse cx="695.2" cy="1070.8" rx="8.9" ry="4.8" fill="#1D1147" stroke-width="2.3"/><ellipse cx="706.5" cy="1070.8" rx="8.9" ry="4.8" fill="#1D1147" stroke-width="2.3"/><path d="M680.7 957.9Q680.7 948.2 689.5 948.2H705.7Q714.5 948.2 714.5 957.9L715.3 1007.9H679.9Z" fill="#FFF4DC"/><path d="M686.3 961.1H708.9V1019.2H686.3Z" fill="#E4147E" stroke-width="2.8"/><rect x="695" y="937.3" width="8.4" height="13.5" fill="#86522F" stroke-width="2.8"/><ci