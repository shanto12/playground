<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" class="cd-hero" role="img" aria-labelledby="cdP-title"><title id="cdP-title">The District at Golden Hour: bunting layer (portrait)</title><style>.cd-hero .cloud{animation:cdh-drift 46s ease-in-out infinite alternate}
.cd-hero .cloud:nth-child(2n){animation-duration:58s;animation-direction:alternate-reverse}
.cd-hero .cloud:nth-child(3n){animation-duration:39s}
.cd-hero .flag{transform-box:fill-box;transform-origin:50% 0;animation:cdh-flutter 2.6s ease-in-out infinite}
.cd-hero .flag:nth-child(2n){animation-duration:3.1s;animation-delay:-1.1s}
.cd-hero .flag:nth-child(3n){animation-duration:2.2s;animation-delay:-.5s}
.cd-hero .lantern{transform-box:fill-box;transform-origin:50% 0;animation:cdh-sway 4.6s ease-in-out infinite}
.cd-hero .lantern:nth-of-type(2n){animation-duration:5.4s;animation-delay:-1.8s}
.cd-hero .steam{transform-box:fill-box;transform-origin:50% 100%;animation:cdh-rise 3.8s ease-out infinite}
.cd-hero .sun-rays{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-spin 140s linear infinite}
.cd-hero .sun-glow{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-pulse 7s ease-in-out infinite}
@keyframes cdh-drift{from{transform:translateX(-34px)}to{transform:translateX(46px)}}
@keyframes cdh-flutter{0%,100%{transform:rotate(-6deg) skewX(4deg)}50%{transform:rotate(6deg) skewX(-4deg)}}
@keyframes cdh-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes cdh-rise{0%{transform:translateY(16px) scale(.8);opacity:0}22%{opacity:.95}100%{transform:translateY(-54px) scale(1.18);opacity:0}}
@keyframes cdh-spin{to{transform:rotate(360deg)}}
@keyframes cdh-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.72}}
.cd-hero.is-paused *,.cd-hero .is-paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.cd-hero *{animation:none!important}}</style><defs><linearGradient id="cdP-sky" x1="0" y1="0" x2="0" y2="1200" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#EE4F98"/><stop offset=".3" stop-color="#FF7A52"/><stop offset=".52" stop-color="#FFA23E"/><stop offset=".72" stop-color="#FFC857"/><stop offset="1" stop-color="#FFE4A6"/></linearGradient><radialGradient id="cdP-glow" cx=".5" cy=".82" r=".85"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".45" stop-color="#FFE38E"/><stop offset="1" stop-color="#FFB000"/></radialGradient><radialGradient id="cdP-halo"><stop offset="0" stop-color="#FFE7A0" stop-opacity=".7"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></radialGradient></defs><g id="bunting" stroke="#1D1147" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round"><path d="M-30 210Q400 394 830 210" fill="none" stroke-width="3.7"/><g><g class="flag"><path d="M-19.3 214.5L20.7 230.4L0.7 272.5Z" fill="#E4147E"/></g><g class="flag"><path d="M42.1 238.3L82.1 251.7L62.1 295Z" fill="#FFB000"/><circle cx="62.1" cy="259.7" r="4.8" fill="#FFF4DC" stroke="none"/></g><g class="flag"><path d="M103.6 258.3L143.6 269.3L123.6 313.8Z" fill="#00A8A0"/><path d="M113.6 267.8L133.6 267.8L123.6 293.8Z" fill="#FFB000" stroke="none"/></g><g class="flag"><path d="M165 274.5L205 283.1L185 328.8Z" fill="#FF6A13"/></g><g class="flag"><path d="M226.4 287L266.4 293.1L246.4 340.1Z" fill="#FFF4DC"/><circle cx="246.4" cy="304.7" r="4.8" fill="#E4147E" stroke="none"/></g><g class="flag"><path d="M287.9 295.7L327.9 299.4L307.9 347.6Z" fill="#3FA34D"/><path d="M297.9 301.6L317.9 301.6L307.9 327.6Z" fill="#FFB000" stroke="none"/></g><g class="flag"><path d="M349.3 300.7L389.3 301.9L369.3 351.3Z" fill="#E4147E"/></g><g class="flag"><path d="M410.7 301.9L450.7 300.7L430.7 351.3Z" fill="#FFB000"/><circle cx="430.7" cy="316" r="4.8" fill="#FFF4DC" stroke="none"/></g><g class="flag"><path d="M472.1 299.4L512.1 295.7L492.1 347.6Z" fill="#00A8A0"/><path d="M482.1 301.6L502.1 301.6L492.1 327.6Z" fill="#FFB000" stroke="none"/></g><g class="flag"><path d="M533.6 293.1L573.6 287L553.6 340.1Z" fill="#FF6A13"/></g><g class="flag"><path d="M595 283.1L635 274.5L615 328.8Z" fill="#FFF4DC"/><circle cx="615" cy="293.5" r="4.8" fill="#E4147E" stroke="none"/></g><g class="flag"><path d="M656.4 269.3L696.4 258.3L676.4 313.8Z" fill="#3FA34D"/><path d="M666.4 267.8L686.4 267.8L676.4 293.8Z" fill="#FFB000" stroke="none"/></g><g class="flag"><path d="M717.9 251.7L757.9 238.3L737.9 295Z" fill="#E4147E"/></g><g class="flag"><path d="M779.3 230.4L819.3 214.5L799.3 272.5Z" fill="#FFB000"/><circle cx="799.3" cy="237.1" r="4.8" fill="#FFF4DC" stroke="none"/></g></g></g></svg>