<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" class="cd-hero" role="img" aria-labelledby="cdP-title"><title id="cdP-title">The District at Golden Hour: clouds layer (portrait)</title><style>.cd-hero .cloud{animation:cdh-drift 46s ease-in-out infinite alternate}
.cd-hero .cloud:nth-child(2n){animation-duration:58s;animation-direction:alternate-reverse}
.cd-hero .cloud:nth-child(3n){animation-duration:39s}
.cd-hero .flag{transform-box:fill-box;transform-origin:50% 0;animation:cdh-flutter 2.6s ease-in-out infinite}
.cd-hero .flag:nth-child(2n){animation-duration:3.1s;animation-delay:-1.1s}
.cd-hero .flag:nth-child(3n){animation-duration:2.2s;animation-delay:-.5s}
.cd-hero .lantern{transform-box:fill-box;transform-origin:50% 0;animation:cdh-sway 4.6s ease-in-out infinite}
.cd-hero .lantern:nth-of-type(2n){animation-duration:5.4s;animation-delay:-1.8s}
.cd-hero .steam{transform-box:fill-box;transform-origin:50% 100%;animation:cdh-rise 3.8s ease-out infinite}
.cd-hero .sun-rays{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-spin 140s linear infinite}
.cd-hero .sun-glow{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-pulse 7s ease-in-out infinite}
@keyframes cdh-drift{from{transform:translateX(-34px)}to{transform:translateX(46px)}}
@keyframes cdh-flutter{0%,100%{transform:rotate(-6deg) skewX(4deg)}50%{transform:rotate(6deg) skewX(-4deg)}}
@keyframes cdh-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes cdh-rise{0%{transform:translateY(16px) scale(.8);opacity:0}22%{opacity:.95}100%{transform:translateY(-54px) scale(1.18);opacity:0}}
@keyframes cdh-spin{to{transform:rotate(360deg)}}
@keyframes cdh-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.72}}
.cd-hero.is-paused *,.cd-hero .is-paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.cd-hero *{animation:none!important}}</style><defs><linearGradient id="cdP-sky" x1="0" y1="0" x2="0" y2="1200" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#EE4F98"/><stop offset=".3" stop-color="#FF7A52"/><stop offset=".52" stop-color="#FFA23E"/><stop offset=".72" stop-color="#FFC857"/><stop offset="1" stop-color="#FFE4A6"/></linearGradient><radialGradient id="cdP-glow" cx=".5" cy=".82" r=".85"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".45" stop-color="#FFE38E"/><stop offset="1" stop-color="#FFB000"/></radialGradient><radialGradient id="cdP-halo"><stop offset="0" stop-color="#FFE7A0" stop-opacity=".7"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></radialGradient></defs><g id="clouds" stroke="#1D1147" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round"><g class="cloud"><path d="M30 150A35 35 0 0 1 90 114A40.3 40.3 0 0 1 170 104A39.4 39.4 0 0 1 234 150Z" fill="#FFF4DC"/><rect x="46" y="135" width="172" height="13" fill="#FFC9C0" stroke="none" rx="6.5"/><path d="M91.2 122q24.5 -10 49 0" fill="none" stroke-width="2.5" opacity="0.5"/></g><g class="cloud"><path d="M560 118A33.8 33.8 0 0 1 616 80A41.6 41.6 0 0 1 698 66A32.3 32.3 0 0 1 758 90A26.1 26.1 0 0 1 802 118Z" fill="#FFF4DC"/><rect x="576" y="103" width="210" height="13" fill="#FFC9C0" stroke="none" rx="6.5"/><path d="M632.6 90q29 -10 58.1 0" fill="none" stroke-width="2.5" opacity="0.5"/></g><g class="cloud"><path d="M470 330A25.6 25.6 0 0 1 514 304A29.2 29.2 0 0 1 572 310A25.1 25.1 0 0 1 618 330Z" fill="#FFF4DC"/><rect x="486" y="315" width="116" height="13" fill="#FFC2D2" stroke="none" rx="6.5"/><path d="M514.4 302q17.8 -10 35.5 0" fill="none" stroke-width="2.5" opacity="0.5"/></g><g class="cloud"><rect x="70" y="400" width="170" height="15" fill="#FFD9CF" rx="7.5"/></g><g class="cloud"><rect x="560" y="410" width="150" height="13" fill="#FFD9CF" rx="6.5"/></g><g class="cloud"><rect x="250" y="330" width="110" height="11" fill="#FFE6D2" rx="5.5"/></g></g></svg>