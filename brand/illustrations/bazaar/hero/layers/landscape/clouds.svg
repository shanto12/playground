<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" class="cd-hero" role="img" aria-labelledby="cdL-title"><title id="cdL-title">The District at Golden Hour: clouds layer (landscape)</title><style>.cd-hero .cloud{animation:cdh-drift 46s ease-in-out infinite alternate}
.cd-hero .cloud:nth-child(2n){animation-duration:58s;animation-direction:alternate-reverse}
.cd-hero .cloud:nth-child(3n){animation-duration:39s}
.cd-hero .flag{transform-box:fill-box;transform-origin:50% 0;animation:cdh-flutter 2.6s ease-in-out infinite}
.cd-hero .flag:nth-child(2n){animation-duration:3.1s;animation-delay:-1.1s}
.cd-hero .flag:nth-child(3n){animation-duration:2.2s;animation-delay:-.5s}
.cd-hero .lantern{transform-box:fill-box;transform-origin:50% 0;animation:cdh-sway 4.6s ease-in-out infinite}
.cd-hero .lantern:nth-of-type(2n){animation-duration:5.4s;animation-delay:-1.8s}
.cd-hero .steam{transform-box:fill-box;transform-origin:50% 100%;animation:cdh-rise 3.8s ease-out infinite}
.cd-hero .sun-rays{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-spin 140s linear infinite}
.cd-hero .sun-glow{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-pulse 7s ease-in-out infinite}
@keyframes cdh-drift{from{transform:translateX(-34px)}to{transform:translateX(46px)}}
@keyframes cdh-flutter{0%,100%{transform:rotate(-6deg) skewX(4deg)}50%{transform:rotate(6deg) skewX(-4deg)}}
@keyframes cdh-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes cdh-rise{0%{transform:translateY(16px) scale(.8);opacity:0}22%{opacity:.95}100%{transform:translateY(-54px) scale(1.18);opacity:0}}
@keyframes cdh-spin{to{transform:rotate(360deg)}}
@keyframes cdh-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.72}}
.cd-hero.is-paused *,.cd-hero .is-paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.cd-hero *{animation:none!important}}</style><defs><linearGradient id="cdL-sky" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#EE4F98"/><stop offset=".3" stop-color="#FF7A52"/><stop offset=".52" stop-color="#FFA23E"/><stop offset=".72" stop-color="#FFC857"/><stop offset="1" stop-color="#FFE4A6"/></linearGradient><radialGradient id="cdL-glow" cx=".5" cy=".82" r=".85"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".45" stop-color="#FFE38E"/><stop offset="1" stop-color="#FFB000"/></radialGradient><pattern id="cdL-violetL" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.4" fill="#6A55C9"/><circle cx="19" cy="19" r="2.4" fill="#6A55C9"/></pattern><pattern id="cdL-raniL" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.4" fill="#FF8CC0"/><circle cx="19" cy="19" r="2.4" fill="#FF8CC0"/></pattern><pattern id="cdL-cilL" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.4" fill="#86CF6E"/><circle cx="19" cy="19" r="2.4" fill="#86CF6E"/></pattern><pattern id="cdL-dado" width="30" height="36" x="-195" y="-38" patternUnits="userSpaceOnUse"><g fill="#FFF4DC"><circle cx="15" cy="12" r="4"/><circle cx="15" cy="24" r="4"/><circle cx="9" cy="18" r="4"/><circle cx="21" cy="18" r="4"/></g><circle cx="15" cy="18" r="3" fill="#FFB000"/></pattern><radialGradient id="cdL-halo"><stop offset="0" stop-color="#FFE7A0" stop-opacity=".7"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></radialGradient></defs><g id="clouds" stroke="#1D1147" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><g class="cloud"><path d="M90 150A40 40 0 0 1 160 110A46 46 0 0 1 250 92A42 42 0 0 1 330 120A33.5 33.5 0 0 1 390 150Z" fill="#FFF4DC"/><rect x="106" y="135" width="268" height="13" fill="#FFC9C0" stroke="none" rx="6.5"/><path d="M180 122q36 -10 72 0" fill="none" stroke-width="1.7" opacity="0.5"/></g><g class="cloud"><path d="M470 248A30.2 30.2 0 0 1 520 214A35.2 35.2 0 0 1 590 222A30.9 30.9 0 0 1 646 248Z" fill="#FFF4DC"/><rect x="486" y="233" width="144" height="13" fill="#FFC2D2" stroke="none" rx="6.5"/><path d="M523 220q21.1 -10 42 0" fill="none" stroke-width="1.7" opacity="0.5"/></g><g class="cloud"><path d="M1130 132A38 38 0 0 1 1192 88A49 49 0 0 1 1288 72A37.3 37.3 0 0 1 1358 98A32.8 32.8 0 0 1 1414 132Z" fill="#FFF4DC"/><rect x="1146" y="117" width="252" height="13" fill="#FFC9C0" stroke="none" rx="6.5"/><path d="M1215 104q34.1 -10 68 0" fill="none" stroke-width="1.7" opacity="0.5"/></g><g class="cloud"><path d="M1380 300A28.3 28.3 0 0 1 1428 270A32.2 32.2 0 0 1 1492 278A27.3 27.3 0 0 1 1542 300Z" fill="#FFF4DC"/><rect x="1396" y="285" width="130" height="13" fill="#FFC2D2" stroke="none" rx="6.5"/><path d="M1429 272q19.4 -10 38.9 0" fill="none" stroke-width="1.7" opacity="0.5"/></g><g class="cloud"><rect x="560" y="300" width="190" height="14" fill="#FFE2D2" rx="7" stroke="none" opacity="0.7"/></g><g class="cloud"><rect x="930" y="268" width="150" height="12" fill="#FFE2D2" rx="6" stroke="none" opacity="0.7"/></g><g class="cloud"><rect x="690" y="226" width="120" height="10" fill="#FFE6D2" rx="5" stroke="none" opacity="0.7"/></g></g></svg>