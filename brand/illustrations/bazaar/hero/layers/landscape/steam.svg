<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" class="cd-hero" role="img" aria-labelledby="cdL-title"><title id="cdL-title">The District at Golden Hour: steam layer (landscape)</title><style>.cd-hero .cloud{animation:cdh-drift 46s ease-in-out infinite alternate}
.cd-hero .cloud:nth-child(2n){animation-duration:58s;animation-direction:alternate-reverse}
.cd-hero .cloud:nth-child(3n){animation-duration:39s}
.cd-hero .flag{transform-box:fill-box;transform-origin:50% 0;animation:cdh-flutter 2.6s ease-in-out infinite}
.cd-hero .flag:nth-child(2n){animation-duration:3.1s;animation-delay:-1.1s}
.cd-hero .flag:nth-child(3n){animation-duration:2.2s;animation-delay:-.5s}
.cd-hero .lantern{transform-box:fill-box;transform-origin:50% 0;animation:cdh-sway 4.6s ease-in-out infinite}
.cd-hero .lantern:nth-of-type(2n){animation-duration:5.4s;animation-delay:-1.8s}
.cd-hero .steam{transform-box:fill-box;transform-origin:50% 100%;animation:cdh-rise 3.8s ease-out infinite}
.cd-hero .sun-rays{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-spin 140s linear infinite}
.cd-hero .sun-glow{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-pulse 7s ease-in-out infinite}
@keyframes cdh-drift{from{transform:translateX(-34px)}to{transform:translateX(46px)}}
@keyframes cdh-flutter{0%,100%{transform:rotate(-6deg) skewX(4deg)}50%{transform:rotate(6deg) skewX(-4deg)}}
@keyframes cdh-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes cdh-rise{0%{transform:translateY(16px) scale(.8);opacity:0}22%{opacity:.95}100%{transform:translateY(-54px) scale(1.18);opacity:0}}
@keyframes cdh-spin{to{transform:rotate(360deg)}}
@keyframes cdh-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.72}}
.cd-hero.is-paused *,.cd-hero .is-paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.cd-hero *{animation:none!important}}</style><defs><linearGradient id="cdL-sky" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#EE4F98"/><stop offset=".3" stop-color="#FF7A52"/><stop offset=".52" stop-color="#FFA23E"/><stop offset=".72" stop-color="#FFC857"/><stop offset="1" stop-color="#FFE4A6"/></linearGradient><radialGradient id="cdL-glow" cx=".5" cy=".82" r=".85"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".45" stop-color="#FFE38E"/><stop offset="1" stop-color="#FFB000"/></radialGradient><radialGradient id="cdL-halo"><stop offset="0" stop-color="#FFE7A0" stop-opacity=".7"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></radialGradient></defs><g id="steam" stroke="#1D1147" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><g class="steam" opacity="0.9" style="animation-delay:0s"><path d="M1139 632C1126 612.2 1152 602.3 1139 585.8S1131.2 572.6 1142.3 566" fill="none" stroke-width="12"/><path d="M1139 632C1126 612.2 1152 602.3 1139 585.8S1131.2 572.6 1142.3 566" fill="none" stroke="#FFFDF5" stroke-width="7.2"/></g><g class="steam" opacity="0.9" style="animation-delay:-1.7s"><path d="M1157 632C1144 612.2 1170 602.3 1157 585.8S1149.2 572.6 1160.3 566" fill="none" stroke-width="12"/><path d="M1157 632C1144 612.2 1170 602.3 1157 585.8S1149.2 572.6 1160.3 566" fill="none" stroke="#FFFDF5" stroke-width="7.2"/></g><g class="steam" opacity="0.9" style="animation-delay:-1.1s"><path d="M1218 652C1205 632.2 1231 622.3 1218 605.8S1210.2 592.6 1221.3 586" fill="none" stroke-width="12"/><path d="M1218 652C1205 632.2 1231 622.3 1218 605.8S1210.2 592.6 1221.3 586" fill="none" stroke="#FFFDF5" stroke-width="7.2"/></g><g class="steam" opacity="0.9" style="animation-delay:-2.8s"><path d="M1236 652C1223 632.2 1249 622.3 1236 605.8S1228.2 592.6 1239.3 586" fill="none" stroke-width="12"/><path d="M1236 652C1223 632.2 1249 622.3 1236 605.8S1228.2 592.6 1239.3 586" fill="none" stroke="#FFFDF5" stroke-width="7.2"/></g><g class="steam" opacity="0.9" style="animation-delay:-2.2s"><path d="M1173 643C1160 623.2 1186 613.3 1173 596.8S1165.2 583.6 1176.3 577" fill="none" stroke-width="12"/><path d="M1173 643C1160 623.2 1186 613.3 1173 596.8S1165.2 583.6 1176.3 577" fill="none" stroke="#FFFDF5" stroke-width="7.2"/></g><g class="steam" opacity="0.9" style="animation-delay:-3.9s"><path d="M1191 643C1178 623.2 1204 613.3 1191 596.8S1183.2 583.6 1194.3 577" fill="none" stroke-width="12"/><path d="M1191 643C1178 623.2 1204 613.3 1191 596.8S1183.2 583.6 1194.3 577" fill="none" stroke="#FFFDF5" stroke-width="7.2"/></g><g class="steam" opacity="0.9" style="animation-delay:-0.6s;animation-duration:4.4s"><path d="M937 322C922 301 952 290.5 937 273S928 259 940.8 252" fill="none" stroke-width="13.1"/><path d="M937 322C922 301 952 290.5 937 273S928 259 940.8 252" fill="none" stroke="#FFFDF5" stroke-width="8.3"/></g><g class="steam" opacity="0.9" style="animation-delay:-2.4s;animation-duration:4.4s"><path d="M950 318C937 300 963 291 950 276S942.2 264 953.3 258" fill="none" stroke-width="12"/><path d="M950 318C937 300 963 291 950 276S942.2 264 953.3 258" fill="none" stroke="#FFFDF5" stroke-width="7.2"/></g><g class="steam" opacity="0.9" style="animation-delay:-1.3s"><path d="M1073.8 672.6C1063.8 659.4 1083.8 652.8 1073.8 641.8S1067.8 633 1076.3 628.6" fill="none" stroke-width="10.3"/><path d="M1073.8 672.6C1063.8 659.4 1083.8 652.8 1073.8 641.8S1067.8 633 1076.3 628.6" fill="none" stroke="#FFFDF5" stroke-width="5.5"/></g></g></svg>