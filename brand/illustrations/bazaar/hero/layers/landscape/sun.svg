<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" class="cd-hero" role="img" aria-labelledby="cdL-title"><title id="cdL-title">The District at Golden Hour: sun layer (landscape)</title><style>.cd-hero .cloud{animation:cdh-drift 46s ease-in-out infinite alternate}
.cd-hero .cloud:nth-child(2n){animation-duration:58s;animation-direction:alternate-reverse}
.cd-hero .cloud:nth-child(3n){animation-duration:39s}
.cd-hero .flag{transform-box:fill-box;transform-origin:50% 0;animation:cdh-flutter 2.6s ease-in-out infinite}
.cd-hero .flag:nth-child(2n){animation-duration:3.1s;animation-delay:-1.1s}
.cd-hero .flag:nth-child(3n){animation-duration:2.2s;animation-delay:-.5s}
.cd-hero .lantern{transform-box:fill-box;transform-origin:50% 0;animation:cdh-sway 4.6s ease-in-out infinite}
.cd-hero .lantern:nth-of-type(2n){animation-duration:5.4s;animation-delay:-1.8s}
.cd-hero .steam{transform-box:fill-box;transform-origin:50% 100%;animation:cdh-rise 3.8s ease-out infinite}
.cd-hero .sun-rays{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-spin 140s linear infinite}
.cd-hero .sun-glow{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-pulse 7s ease-in-out infinite}
@keyframes cdh-drift{from{transform:translateX(-34px)}to{transform:translateX(46px)}}
@keyframes cdh-flutter{0%,100%{transform:rotate(-6deg) skewX(4deg)}50%{transform:rotate(6deg) skewX(-4deg)}}
@keyframes cdh-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes cdh-rise{0%{transform:translateY(16px) scale(.8);opacity:0}22%{opacity:.95}100%{transform:translateY(-54px) scale(1.18);opacity:0}}
@keyframes cdh-spin{to{transform:rotate(360deg)}}
@keyframes cdh-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.72}}
.cd-hero.is-paused *,.cd-hero .is-paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.cd-hero *{animation:none!important}}</style><defs><linearGradient id="cdL-sky" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#EE4F98"/><stop offset=".3" stop-color="#FF7A52"/><stop offset=".52" stop-color="#FFA23E"/><stop offset=".72" stop-color="#FFC857"/><stop offset="1" stop-color="#FFE4A6"/></linearGradient><radialGradient id="cdL-glow" cx=".5" cy=".82" r=".85"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".45" stop-color="#FFE38E"/><stop offset="1" stop-color="#FFB000"/></radialGradient><radialGradient id="cdL-halo"><stop offset="0" stop-color="#FFE7A0" stop-opacity=".7"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></radialGradient></defs><g id="sun" stroke="#1D1147" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><g class="sun-glow" stroke="none"><circle cx="800" cy="352" r="445" fill="#FFF4DC" opacity="0.1"/><circle cx="800" cy="352" r="329.3" fill="#FFF4DC" opacity="0.1"/><circle cx="800" cy="352" r="242.1" fill="#FFF4DC" opacity="0.2"/></g><path d="M800 352L2298.1 277L2298.1 427ZM800 352L1938.7 620.8L1920.5 688.6ZM800 352L2134.9 1036.1L2059.9 1166ZM800 352L1651.8 1154.1L1602.1 1203.8ZM800 352L1614 1611.9L1484.1 1686.9ZM800 352L1136.6 1472.5L1068.8 1490.7ZM800 352L875 1850.1L725 1850.1ZM800 352L531.2 1490.7L463.4 1472.5ZM800 352L115.9 1686.9L-14 1611.9ZM800 352L-2.1 1203.8L-51.8 1154.1ZM800 352L-459.9 1166L-534.9 1036.1ZM800 352L-320.5 688.6L-338.7 620.8ZM800 352L-698.1 427L-698.1 277ZM800 352L-338.7 83.2L-320.5 15.4ZM800 352L-534.9 -332.1L-459.9 -462ZM800 352L-51.8 -450.1L-2.1 -499.8ZM800 352L-14 -907.9L115.9 -982.9ZM800 352L463.4 -768.5L531.2 -786.7ZM800 352L725 -1146.1L875 -1146.1ZM800 352L1068.8 -786.7L1136.6 -768.5ZM800 352L1484.1 -982.9L1614 -907.9ZM800 352L1602.1 -499.8L1651.8 -450.1ZM800 352L2059.9 -462L2134.9 -332.1ZM800 352L1920.5 15.4L1938.7 83.2Z" fill="#FFF4DC" class="sun-rays" stroke="none" opacity="0.2"/><circle cx="800" cy="352" r="178" fill="#FFD56E" stroke-width="3.3"/><circle cx="800" cy="352" r="146" fill="#FFE7A1" stroke="none"/><circle cx="746.6" cy="295" r="35.6" fill="#FFF4DC" stroke="none" opacity="0.8"/></g></svg>