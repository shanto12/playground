<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" class="cd-hero" role="img" aria-labelledby="cdL-title"><title id="cdL-title">The District at Golden Hour: sun layer (landscape)</title><style>.cd-hero .cloud{animation:cdh-drift 46s ease-in-out infinite alternate}
.cd-hero .cloud:nth-child(2n){animation-duration:58s;animation-direction:alternate-reverse}
.cd-hero .cloud:nth-child(3n){animation-duration:39s}
.cd-hero .flag{transform-box:fill-box;transform-origin:50% 0;animation:cdh-flutter 2.6s ease-in-out infinite}
.cd-hero .flag:nth-child(2n){animation-duration:3.1s;animation-delay:-1.1s}
.cd-hero .flag:nth-child(3n){animation-duration:2.2s;animation-delay:-.5s}
.cd-hero .lantern{transform-box:fill-box;transform-origin:50% 0;animation:cdh-sway 4.6s ease-in-out infinite}
.cd-hero .lantern:nth-of-type(2n){animation-duration:5.4s;animation-delay:-1.8s}
.cd-hero .steam{transform-box:fill-box;transform-origin:50% 100%;animation:cdh-rise 3.8s ease-out infinite}
.cd-hero .sun-rays{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-spin 140s linear infinite}
.cd-hero .sun-glow{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-pulse 7s ease-in-out infinite}
@keyframes cdh-drift{from{transform:translateX(-34px)}to{transform:translateX(46px)}}
@keyframes cdh-flutter{0%,100%{transform:rotate(-6deg) skewX(4deg)}50%{transform:rotate(6deg) skewX(-4deg)}}
@keyframes cdh-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes cdh-rise{0%{transform:translateY(16px) scale(.8);opacity:0}22%{opacity:.95}100%{transform:translateY(-54px) scale(1.18);opacity:0}}
@keyframes cdh-spin{to{transform:rotate(360deg)}}
@keyframes cdh-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.72}}
.cd-hero.is-paused *,.cd-hero .is-paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.cd-hero *{animation:none!important}}</style><defs><linearGradient id="cdL-sky" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#EE4F98"/><stop offset=".3" stop-color="#FF7A52"/><stop offset=".52" stop-color="#FFA23E"/><stop offset=".72" stop-color="#FFC857"/><stop offset="1" stop-color="#FFE4A6"/></linearGradient><radialGradient id="cdL-glow" cx=".5" cy=".82" r=".85"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".45" stop-color="#FFE38E"/><stop offset="1" stop-color="#FFB000"/></radialGradient><pattern id="cdL-violetL" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.4" fill="#6A55C9"/><circle cx="19" cy="19" r="2.4" fill="#6A55C9"/></pattern><pattern id="cdL-raniL" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.4" fill="#FF8CC0"/><circle cx="19" cy="19" r="2.4" fill="#FF8CC0"/></pattern><pattern id="cdL-cilL" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.4" fill="#86CF6E"/><circle cx="19" cy="19" r="2.4" fill="#86CF6E"/></pattern><pattern id="cdL-dado" width="30" height="36" x="-195" y="-38" patternUnits="userSpaceOnUse"><g fill="#FFF4DC"><circle cx="15" cy="12" r="4"/><circle cx="15" cy="24" r="4"/><circle cx="9" cy="18" r="4"/><circle cx="21" cy="18" r="4"/></g><circle cx="15" cy="18" r="3" fill="#FFB000"/></pattern><radialGradient id="cdL-halo"><stop offset="0" stop-color="#FFE7A0" stop-opacity=".7"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></radialGradient></defs><g id="sun" stroke="#1D1147" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><g class="sun-glow" stroke="none"><circle cx="800" cy="352" r="445" fill="#FFF4DC" opacity="0.1"/><circle cx="800" cy="352" r="329" fill="#FFF4DC" opacity="0.1"/><circle cx="800" cy="352" r="242" fill="#FFF4DC" opacity="0.2"/></g><path d="M800 352L2298 277L2298 427ZM800 352L1939 621L1921 689ZM800 352L2135 1036L2060 1166ZM800 352L1652 1154L1602 1204ZM800 352L1614 1612L1484 1687ZM800 352L1137 1473L1069 1491ZM800 352L875 1850L725 1850ZM800 352L531 1491L463 1473ZM800 352L116 1687L-14 1612ZM800 352L-2.1 1204L-52 1154ZM800 352L-460 1166L-535 1036ZM800 352L-321 689L-339 621ZM800 352L-698 427L-698 277ZM800 352L-339 83L-321 15.4ZM800 352L-535 -332L-460 -462ZM800 352L-52 -450L-2.1 -500ZM800 352L-14 -908L116 -983ZM800 352L463 -769L531 -787ZM800 352L725 -1146L875 -1146ZM800 352L1069 -787L1137 -769ZM800 352L1484 -983L1614 -908ZM800 352L1602 -500L1652 -450ZM800 352L2060 -462L2135 -332ZM800 352L1921 15.4L1939 83Z" fill="#FFF4DC" class="sun-rays" stroke="none" opacity="0.2"/><circle cx="800" cy="352" r="178" fill="#FFD56E" stroke-width="3.3"/><circle cx="800" cy="352" r="146" fill="#FFE7A1" stroke="none"/><circle cx="747" cy="295" r="35.6" fill="#FFF4DC" stroke="none" opacity="0.8"/></g></svg>