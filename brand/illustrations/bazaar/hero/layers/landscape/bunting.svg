<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" class="cd-hero" role="img" aria-labelledby="cdL-title"><title id="cdL-title">The District at Golden Hour: bunting layer (landscape)</title><style>.cd-hero .cloud{animation:cdh-drift 46s ease-in-out infinite alternate}
.cd-hero .cloud:nth-child(2n){animation-duration:58s;animation-direction:alternate-reverse}
.cd-hero .cloud:nth-child(3n){animation-duration:39s}
.cd-hero .flag{transform-box:fill-box;transform-origin:50% 0;animation:cdh-flutter 2.6s ease-in-out infinite}
.cd-hero .flag:nth-child(2n){animation-duration:3.1s;animation-delay:-1.1s}
.cd-hero .flag:nth-child(3n){animation-duration:2.2s;animation-delay:-.5s}
.cd-hero .lantern{transform-box:fill-box;transform-origin:50% 0;animation:cdh-sway 4.6s ease-in-out infinite}
.cd-hero .lantern:nth-of-type(2n){animation-duration:5.4s;animation-delay:-1.8s}
.cd-hero .steam{transform-box:fill-box;transform-origin:50% 100%;animation:cdh-rise 3.8s ease-out infinite}
.cd-hero .sun-rays{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-spin 140s linear infinite}
.cd-hero .sun-glow{transform-box:fill-box;transform-origin:50% 50%;animation:cdh-pulse 7s ease-in-out infinite}
@keyframes cdh-drift{from{transform:translateX(-34px)}to{transform:translateX(46px)}}
@keyframes cdh-flutter{0%,100%{transform:rotate(-6deg) skewX(4deg)}50%{transform:rotate(6deg) skewX(-4deg)}}
@keyframes cdh-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes cdh-rise{0%{transform:translateY(16px) scale(.8);opacity:0}22%{opacity:.95}100%{transform:translateY(-54px) scale(1.18);opacity:0}}
@keyframes cdh-spin{to{transform:rotate(360deg)}}
@keyframes cdh-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.72}}
.cd-hero.is-paused *,.cd-hero .is-paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.cd-hero *{animation:none!important}}</style><defs><linearGradient id="cdL-sky" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#EE4F98"/><stop offset=".3" stop-color="#FF7A52"/><stop offset=".52" stop-color="#FFA23E"/><stop offset=".72" stop-color="#FFC857"/><stop offset="1" stop-color="#FFE4A6"/></linearGradient><radialGradient id="cdL-glow" cx=".5" cy=".82" r=".85"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".45" stop-color="#FFE38E"/><stop offset="1" stop-color="#FFB000"/></radialGradient><pattern id="cdL-violetL" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.4" fill="#6A55C9"/><circle cx="19" cy="19" r="2.4" fill="#6A55C9"/></pattern><pattern id="cdL-raniL" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.4" fill="#FF8CC0"/><circle cx="19" cy="19" r="2.4" fill="#FF8CC0"/></pattern><pattern id="cdL-cilL" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.4" fill="#86CF6E"/><circle cx="19" cy="19" r="2.4" fill="#86CF6E"/></pattern><pattern id="cdL-dado" width="30" height="36" x="-195" y="-38" patternUnits="userSpaceOnUse"><g fill="#FFF4DC"><circle cx="15" cy="12" r="4"/><circle cx="15" cy="24" r="4"/><circle cx="9" cy="18" r="4"/><circle cx="21" cy="18" r="4"/></g><circle cx="15" cy="18" r="3" fill="#FFB000"/></pattern><radialGradient id="cdL-halo"><stop offset="0" stop-color="#FFE7A0" stop-opacity=".7"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></radialGradient></defs><g id="bunting" stroke="#1D1147" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M-30 64Q800 300 1630 64" fill="none" stroke-width="2.4"/><g><g class="flag"><path d="M-20 67L15.7 77L-2.3 117Z" fill="#E4147E"/></g><g class="flag"><path d="M35 82L71 91L53 131Z" fill="#FFB000"/><circle cx="53" cy="99" r="4.3" fill="#FFF4DC" stroke="none"/></g><g class="flag"><path d="M90 96L126 104L108 145Z" fill="#00A8A0"/><path d="M99 104L117 104L108 127Z" fill="#FFB000" stroke="none"/></g><g class="flag"><path d="M146 109L182 117L164 158Z" fill="#FF6A13"/></g><g class="flag"><path d="M201 121L237 128L219 169Z" fill="#FFF4DC"/><circle cx="219" cy="137" r="4.3" fill="#E4147E" stroke="none"/></g><g class="flag"><path d="M256 131L292 138L274 180Z" fill="#3FA34D"/><path d="M265 139L283 139L274 162Z" fill="#FFB000" stroke="none"/></g><g class="flag"><path d="M312 141L348 147L330 189Z" fill="#E4147E"/></g><g class="flag"><path d="M367 150L403 155L385 197Z" fill="#FFB000"/><circle cx="385" cy="165" r="4.3" fill="#FFF4DC" stroke="none"/></g><g class="flag"><path d="M422 158L458 162L440 205Z" fill="#00A8A0"/><path d="M431 164L449 164L440 187Z" fill="#FFB000" stroke="none"/></g><g class="flag"><path d="M478 164L514 168L496 211Z" fill="#FF6A13"/></g><g class="flag"><path d="M533 170L569 173L551 216Z" fill="#FFF4DC"/><circle cx="551" cy="184" r="4.3" fill="#E4147E" stroke="none"/></g><g class="flag"><path d="M588 174L624 177L606 221Z" fill="#3FA34D"/><path d="M597 180L615 180L606 203Z" fill="#FFB000" stroke="none"/></g><g class="flag"><path d="M644 178L680 180L662 224Z" fill="#E4147E"/></g><g class="flag"><path d="M699 180L735 181L717 226Z" fill="#FFB000"/><circle cx="717" cy="194" r="4.3" fill="#FFF4DC" stroke="none"/></g><g class="flag"><path d="M754 182L790 182L772 227Z" fill="#00A8A0"/><path d="M763 186L781 186L772 209Z" fill="#FFB000" stroke="none"/></g><g class="flag"><path d="M810 182L846 182L828 227Z" fill="#FF6A13"/></g><g class="flag"><path d="M865 181L901 180L883 226Z" fill="#FFF4DC"/><circle cx="883" cy="194" r="4.3" fill="#E4147E" stroke="none"/></g><g class="flag"><path d="M920 180L956 178L938 224Z" fill="#3FA34D"/><path d="M929 183L947 183L938 206Z" fill="#FFB000" stroke="none"/></g><g class="flag"><path d="M976 177L1012 174L994 221Z" fill="#E4147E"/></g><g class="flag"><path d="M1031 173L1067 170L1049 216Z" fill="#FFB000"/><circle cx="1049" cy="184" r="