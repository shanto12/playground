<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" aria-hidden="true" focusable="false"><defs><linearGradient id="L-floor" gradientUnits="userSpaceOnUse" x1="0" y1="560" x2="0" y2="1000"><stop offset="0" stop-color="#E89A55"/><stop offset=".03" stop-color="#C9664A"/><stop offset=".09" stop-color="#8E2C4E"/><stop offset=".2" stop-color="#521C55"/><stop offset=".4" stop-color="#2E1443"/><stop offset=".7" stop-color="#1D0D2D"/><stop offset="1" stop-color="#12081E"/></linearGradient><radialGradient id="L-halo"><stop offset="0" stop-color="#F7D98A" stop-opacity=".5"/><stop offset=".22" stop-color="#E9A63A" stop-opacity=".26"/><stop offset=".55" stop-color="#D2714A" stop-opacity=".09"/><stop offset="1" stop-color="#D2714A" stop-opacity="0"/></radialGradient><linearGradient id="L-refl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D98A" stop-opacity=".55"/><stop offset=".45" stop-color="#E9A63A" stop-opacity=".18"/><stop offset="1" stop-color="#E9A63A" stop-opacity="0"/></linearGradient><radialGradient id="L-reflJ"><stop offset="0" stop-color="#F7C45A" stop-opacity=".42"/><stop offset=".45" stop-color="#D9782F" stop-opacity=".14"/><stop offset="1" stop-color="#D9782F" stop-opacity="0"/></radialGradient></defs><style>.star{transform-box:fill-box;transform-origin:center;animation:cd-twinkle 4.5s ease-in-out infinite}.lantern{transform-box:fill-box;transform-origin:50% 0;animation:cd-sway 7.5s ease-in-out infinite}.lantern .glow{animation:cd-glow 3.4s ease-in-out infinite alternate}.flame{transform-box:fill-box;transform-origin:50% 100%;animation:cd-flicker 1.6s ease-in-out infinite alternate}.steam{animation:cd-rise 5.2s ease-in-out infinite;opacity:0}.ember{animation:cd-float var(--t,9s) linear infinite;opacity:0}.shimmer{stroke-dasharray:60 940;stroke-dashoffset:1000;animation:cd-sweep 12s cubic-bezier(.45,0,.55,1) infinite;opacity:0}@keyframes cd-twinkle{0%,100%{opacity:.35;transform:scale(.72)}50%{opacity:1;transform: