<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" aria-hidden="true" focusable="false"><defs><radialGradient id="P-ember"><stop offset="0" stop-color="#FFF6D2"/><stop offset=".35" stop-color="#F7D98A" stop-opacity=".9"/><stop offset="1" stop-color="#E9A63A" stop-opacity="0"/></radialGradient></defs><style>.star{transform-box:fill-box;transform-origin:center;animation:cd-twinkle 4.5s ease-in-out infinite}.lantern{transform-box:fill-box;transform-origin:50% 0;animation:cd-sway 7.5s ease-in-out infinite}.lantern .glow{animation:cd-glow 3.4s ease-in-out infinite alternate}.flame{transform-box:fill-box;transform-origin:50% 100%;animation:cd-flicker 1.6s ease-in-out infinite alternate}.steam{animation:cd-rise 5.2s ease-in-out infinite;opacity:0}.ember{animation:cd-float var(--t,9s) linear infinite;opacity:0}.shimmer{stroke-dasharray:60 940;stroke-dashoffset:1000;animation:cd-sweep 12s cubic-bezier(.45,0,.55,1) infinite;opacity:0}@keyframes cd-twinkle{0%,100%{opacity:.35;transform:scale(.72)}50%{opacity:1;transform:scale(1)}}@keyframes cd-sway{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}@keyframes cd-glow{from{opacity:.72}to{opacity:1}}@keyframes cd-flicker{0%{transform:scale(1,1)}40%{transform:scale(.94,1.08)}70%{transform:scale(1.05,.95)}100%{transform:scale(.97,1.04)}}@keyframes cd-rise{0%{opacity:0;transform:translateY(10px)}30%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}@keyframes cd-float{0%{opacity:0;transform:translate(0,0)}12%{opacity:1}80%{opacity:.75}100%{opacity:0;transform:translate(var(--dx,0),var(--dy,-200px))}}@keyframes cd-sweep{0%{stroke-dashoffset:1000;opacity:0}6%{opacity:1}55%{opacity:1}62%,100%{stroke-dashoffset:0;opacity:0}}@media (prefers-reduced-motion:reduce){.star,.lantern,.lantern .glow,.flame,.steam,.ember,.shimmer{animation:none!important}.steam{opacity:.7}.ember{opacity:.6}.shimmer{opacity:0}}</style><g id="embers"><circle class="ember" cx="748.3" cy="913" r="7.2" fill="url