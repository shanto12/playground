<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" aria-hidden="true" focusable="false"><defs><radialGradient id="P-jHalo"><stop offset="0" stop-color="#F2A64A" stop-opacity=".42"/><stop offset=".5" stop-color="#C8573A" stop-opacity=".14"/><stop offset="1" stop-color="#A3173F" stop-opacity="0"/></radialGradient><radialGradient id="P-jaliG" cx=".5" cy=".58" r=".62"><stop offset="0" stop-color="#FFF1C4"/><stop offset=".3" stop-color="#F8C863"/><stop offset=".66" stop-color="#DC7A30"/><stop offset="1" stop-color="#8A2638"/></radialGradient><pattern id="P-lat" width="23.3" height="23.3" patternUnits="userSpaceOnUse"><g fill="none" stroke="#2A0E2A" stroke-width="3.3"><circle r="11.6"/><circle cx="23.3" r="11.6"/><circle cy="23.3" r="11.6"/><circle cx="23.3" cy="23.3" r="11.6"/><circle cx="11.6" cy="11.6" r="11.6"/></g></pattern><linearGradient id="P-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B7791F"/><stop offset=".38" stop-color="#F7D98A"/><stop offset=".6" stop-color="#E9A63A"/><stop offset="1" stop-color="#B7791F"/></linearGradient></defs><style>.star{transform-box:fill-box;transform-origin:center;animation:cd-twinkle 4.5s ease-in-out infinite}.lantern{transform-box:fill-box;transform-origin:50% 0;animation:cd-sway 7.5s ease-in-out infinite}.lantern .glow{animation:cd-glow 3.4s ease-in-out infinite alternate}.flame{transform-box:fill-box;transform-origin:50% 100%;animation:cd-flicker 1.6s ease-in-out infinite alternate}.steam{animation:cd-rise 5.2s ease-in-out infinite;opacity:0}.ember{animation:cd-float var(--t,9s) linear infinite;opacity:0}.shimmer{stroke-dasharray:60 940;stroke-dashoffset:1000;animation:cd-sweep 12s cubic-bezier(.45,0,.55,1) infinite;opacity:0}@keyframes cd-twinkle{0%,100%{opacity:.35;transform:scale(.72)}50%{opacity:1;transform:scale(1)}}@keyframes cd-sway{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}@keyframes cd-glow{from{opacity:.72}to{opacity:1}}@keyframes cd-flicker