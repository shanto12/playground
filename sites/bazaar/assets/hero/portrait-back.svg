 rx="3.5"/><rect x="560" y="600" width="160" height="7" fill="#FFF4DC" rx="3.5"/></g></g><g id="sun" stroke="#1D1147" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round"><g class="sun-glow" stroke="none"><circle cx="400" cy="500" r="490" fill="#FFF4DC" opacity="0.1"/><circle cx="400" cy="500" r="363" fill="#FFF4DC" opacity="0.1"/><circle cx="400" cy="500" r="267" fill="#FFF4DC" opacity="0.2"/></g><path d="M400 500L1895 621L1876 770ZM400 500L1494 915L1467 980ZM400 500L1634 1353L1543 1471ZM400 500L1140 1406L1084 1449ZM400 500L1043 1855L904 1913ZM400 500L587 1655L518 1664ZM400 500L279 1995L130 1976ZM400 500L-15.1 1594L-80 1567ZM400 500L-453 1734L-571 1643ZM400 500L-506 1240L-549 1184ZM400 500L-955 1143L-1013 1004ZM400 500L-755 687L-764 618ZM400 500L-1095 379L-1076 230ZM400 500L-694 85L-667 20ZM400 500L-834 -353L-743 -471ZM400 500L-340 -406L-284 -449ZM400 500L-243 -855L-104 -913ZM400 500L213 -655L282 -664ZM400 500L521 -995L670 -976ZM400 500L815 -594L880 -567ZM400 500L1253 -734L1371 -643ZM400 500L1306 -240L1349 -184ZM400 500L1755 -143L1813 -4ZM400 500L1555 313L1564 382Z" fill="#FFF4DC" class="sun-rays" stroke="none" opacity="0.2"/><circle cx="400" cy="500" r="196" fill="#FFD56E" stroke-width="5.1"/><circle cx="400" cy="500" r="161" fill="#FFE7A1" stroke="none"/><circle cx="341" cy="437" r="39" fill="#FFF4DC" stroke="none" opacity="0.8"/></g><g id="clouds" stroke="#1D1147" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round"><g class="cloud"><path d="M30 150A35 35 0 0 1 90 114A40 40 0 0 1 170 104A39 39 0 0 1 234 150Z" fill="#FFF4DC"/><rect x="46" y="135" width="172" height="13" fill="#FFC9C0" stroke="none" rx="6.5"/><path d="M91 122q24 -10 49 0" fill="none" stroke-width="2.5" opacity="0.5"/></g><g class="cloud"><path d="M560 118A34 34 0 0 1 616 80A42 42 0 0 1 698 66A32 32 0 0 1 758 90A26 26 0 0 1 802 118Z" fill="#FFF4DC"/><rect x="576" y="103" width="210" height="13" fill="#FFC9C0" stroke="none" rx="6.5"/><path d="M633 90q29 -10 58 0" fill="none