*{box-sizing:border-box;margin:0;padding:0}

.cv{position:relative;overflow:hidden}
.abs{position:absolute}

.stk{paint-order:stroke fill;-webkit-text-stroke:var(--sw,14px) #1D1147}
/* street-sign plate (echoes the DISTRICT plate in the logo) */
.plate{display:inline-flex;align-items:center;gap:14px;font-family:'Bowlby One',sans-serif;text-transform:uppercase;letter-spacing:.04em;
  background:#00A8A0;color:#FFF4DC;border:6px solid #1D1147;border-radius:16px;padding:12px 26px 14px;box-shadow:8px 8px 0 #1D1147;position:relative;line-height:1}
.plate::after{content:"";position:absolute;inset:6px;border:3px solid #FFF4DC;border-radius:9px;pointer-events:none;opacity:.9}
.plate.mari{background:#FFB000;color:#1D1147} .plate.mari::after{border-color:#1D1147;opacity:.35}
.plate.cream{background:#FFF4DC;color:#1D1147} .plate.cream::after{border-color:#1D1147;opacity:.3}
.plate.rani{background:#E4147E;color:#FFF4DC}
.plate.saff{background:#FF6A13;color:#1D1147} .plate.saff::after{border-color:#1D1147;opacity:.35}
.plate.ink{background:#1D1147;color:#FFF4DC;box-shadow:8px 8px 0 #E4147E}
.card{background:#fff;border:6px solid #1D1147;border-radius:28px;box-shadow:12px 12px 0 #1D1147}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:12px;border:5px solid #1D1147;border-radius:999px;font-weight:800;line-height:1;white-space:nowrap}
.tilt-l{transform:rotate(-3deg)} .tilt-r{transform:rotate(3deg)}
