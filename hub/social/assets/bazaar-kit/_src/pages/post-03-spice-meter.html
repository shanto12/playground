.plate::after{content:"";position:absolute;inset:6px;border:3px solid #FFF4DC;border-radius:9px;pointer-events:none;opacity:.9}

.card{background:#fff;border:6px solid #1D1147;border-radius:28px;box-shadow:12px 12px 0 #1D1147}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:12px;border:5px solid #1D1147;border-radius:999px;font-weight:800;line-height:1;white-space:nowrap}
.tilt-l{transform:rotate(-3deg)} .tilt-r{transform:rotate(3deg)}
