<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<title>Curry District social kit</title><style>
@font-face{font-family:'Bowlby One';src:url(file:///home/user/playground/hub/social/assets/bazaar-kit/_src/fonts/bowlby-one.woff2) format('woff2');font-weight:400;font-display:block}
@font-face{font-family:'DM Sans';src:url(file:///home/user/playground/hub/social/assets/bazaar-kit/_src/fonts/dm-sans.woff2) format('woff2');font-weight:100 1000;font-display:block}
@font-face{font-family:'Caveat';src:url(file:///home/user/playground/hub/social/assets/bazaar-kit/_src/fonts/caveat.woff2) format('woff2');font-weight:400 700;font-display:block}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:'DM Sans',system-ui,sans-serif;color:#1D1147;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.cv{position:relative;overflow:hidden}
.abs{position:absolute}
.burst{position:absolute;inset:0;width:100%;height:100%}
.dish{position:absolute}
.dish svg{width:100%;height:100%;display:block;overflow:visible}
.ico{display:inline-block;line-height:0}
.ico svg{width:100%;height:100%;display:block;overflow:visible}
.logo{display:block}
.disp{font-family:'Bowlby One','Arial Black',sans-serif;text-transform:uppercase;line-height:.92;letter-spacing:.01em;font-weight:400}
.hand{font-family:'Caveat',cursive;font-weight:700;line-height:1}
.stk{paint-order:stroke fill;-webkit-text-stroke:var(--sw,14px) #1D1147}
/* street-sign plate (echoes the DISTRICT plate in the logo) */
.plate{display:inline-flex;align-items:center;gap:14px;font-family:'Bowlby One',sans-serif;text-transform:uppercase;letter-spacing:.04em;
  background:#00A8A0;color:#FFF4DC;border:6px solid #1D1147;border-radius:16px;padding:12px 26px 14px;box-shadow:8px 8px 0 #1D1147;position:relative;line-height:1}
.plate::after{content:"";position:absolute;inset:6px;border:3px solid #FFF4DC;border-radius:9px;pointer-events:none;opacity:.9}
.plate.mari{background:#FFB000;color:#1D1147} .plate.mari::after{border-color:#1D1147;opacity:.35}
.plate.cream{background:#FFF4DC;color:#1D1147} .plate.cream::after{border-color:#1D1147;opacity:.3}
.plate.rani{background:#E4147E;color:#FFF4DC}
.plate.saff{background:#FF6A13;color:#1D1147} .plate.saff::after{border-color:#1D1147;opacity:.35}
.plate.ink{background:#1D1147;color:#FFF4DC;box-shadow:8px 8px 0 #E4147E}
.card{background:#fff;border:6px solid #1D1147;border-radius:28px;box-shadow:12px 12px 0 #1D1147}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:12px;border:5px solid #1D1147;border-radius:999px;font-weight:800;line-height:1;white-space:nowrap}
.tilt-l{transform:rotate(-3deg)} .tilt-r{transform:rotate(3deg)}

html,body{width:900px;height:420px}
.cv{width:900px;height:420px;background:#FF6A13}
</style></head><body><div class="cv" id="cv"><h1 class="disp stk" style="font-size:150px;color:#FFF4DC;--sw:20px;padding:20px">BUTTER</h1><h1 class="disp stk" style="font-size:150px;color:#FFF4DC;--sw:20px;padding:0 20px;stroke-linejoin:round">BUTTER</h1></div></body></html>
