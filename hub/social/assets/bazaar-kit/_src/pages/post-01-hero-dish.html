.foot.on-light{background:#1D1147;box-shadow:6px 6px 0 rgba(29,17,71,.35)}

.foot__txt{font-weight:800;font-size:27px;letter-spacing:.06em;text-transform:uppercase}
.foot.on-light{color:#FFF4DC} .foot.on-dark{color:#1D1147}
